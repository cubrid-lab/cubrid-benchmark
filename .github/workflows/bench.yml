name: Benchmark

on:
  pull_request:
  schedule:
    - cron: "0 3 * * *"
    - cron: "0 4 * * 0"
  workflow_dispatch:

jobs:
  tier0-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    services:
      cubrid:
        image: cubrid/cubrid:11.2
        env:
          CUBRID_DB: benchdb
        ports:
          - 33000:33000
        options: >-
          --health-cmd "bash -c 'echo > /dev/tcp/127.0.0.1/33000'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: bench
          MYSQL_DATABASE: benchdb
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h127.0.0.1 -uroot -pbench --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r python/requirements.txt

      - name: Install TypeScript dependencies
        run: cd typescript && npm ci

      - name: Wait for databases
        run: ./scripts/wait_for_db.sh

      - name: Apply schema and seed data
        run: make seed

      - name: Run Python Tier 0
        run: make tier0

      - name: Run TypeScript Tier 0
        run: make tier0-ts

      - name: Run Go Tier 0
        run: make tier0-go

  nightly:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.event.schedule == '0 3 * * *')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      issues: write
    services:
      cubrid:
        image: cubrid/cubrid:11.2
        env:
          CUBRID_DB: benchdb
        ports:
          - 33000:33000
        options: >-
          --health-cmd "bash -c 'echo > /dev/tcp/127.0.0.1/33000'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: bench
          MYSQL_DATABASE: benchdb
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h127.0.0.1 -uroot -pbench --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.75.0"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r python/requirements.txt

      - name: Install TypeScript dependencies
        run: cd typescript && npm ci

      - name: Wait for databases
        run: ./scripts/wait_for_db.sh

      - name: Apply schema and seed data
        run: make seed

      - name: Run Python Tier 0
        run: make tier0

      - name: Run TypeScript Tier 0
        run: make tier0-ts

      - name: Run Go Tier 0
        run: make tier0-go

      - name: Run Python Tier 1
        run: make tier1-python

      - name: Run Python Tier 1 Extended
        run: make tier1-python-extended

      - name: Run Python Tier 2
        run: make tier2-python

      - name: Run TypeScript Tier 1
        run: make tier1-ts

      - name: Run TypeScript Tier 1 Extended
        run: make tier1-ts-extended

      - name: Run Go Tier 1
        run: make tier1-go

      - name: Run Go Tier 1 Extended
        run: make tier1-go-extended

      - name: Run Rust Tier 0
        run: make tier0-rust

      - name: Run Rust Tier 1
        run: make tier1-rust

      - name: Normalize benchmark result
        run: |
          python3 scripts/normalize_results.py results/python_tier1.json > results/normalized_python_tier1.json
          python3 scripts/normalize_results.py results/python_tier1_extended.json > results/normalized_python_tier1_extended.json

      - name: Emit benchforge v2 results
        run: |
          python3 scripts/emit_benchforge_v2.py \
            --input results/python_tier1.json \
            --output results/benchforge_v2/python_tier1.json \
            --suite-name python-tier1 \
            --tier tier1 \
            --language python \
            --driver mixed \
            --database mixed
          python3 scripts/emit_benchforge_v2.py \
            --input results/python_tier1_extended.json \
            --output results/benchforge_v2/python_tier1_extended.json \
            --suite-name python-tier1-extended \
            --tier tier1-extended \
            --language python \
            --driver mixed \
            --database mixed
          python3 scripts/emit_benchforge_v2.py \
            --input results/tier2_python.json \
            --output results/benchforge_v2/python_tier2.json \
            --suite-name python-tier2 \
            --tier tier2 \
            --language python \
            --driver mixed \
            --database mixed

      - name: Find previous benchforge v2 artifact
        id: previous_benchforge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import os
          import urllib.error
          import urllib.request

          api_url = os.environ["GITHUB_API_URL"]
          repository = os.environ["GITHUB_REPOSITORY"]
          current_run_id = os.environ["GITHUB_RUN_ID"]
          token = os.environ["GH_TOKEN"]
          output_path = os.environ["GITHUB_OUTPUT"]

          def request_json(url: str) -> dict[str, object]:
              request = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.loads(response.read().decode("utf-8"))

          artifact_name = ""
          run_id = ""
          try:
              runs_payload = request_json(
                  f"{api_url}/repos/{repository}/actions/workflows/bench.yml/runs?branch=main&status=completed&per_page=20"
              )
              workflow_runs = runs_payload.get("workflow_runs", [])
              if isinstance(workflow_runs, list):
                  for run in workflow_runs:
                      if not isinstance(run, dict):
                          continue
                      if run.get("conclusion") != "success":
                          continue
                      candidate_id = str(run.get("id", ""))
                      if not candidate_id or candidate_id == current_run_id:
                          continue
                      artifacts_payload = request_json(
                          f"{api_url}/repos/{repository}/actions/runs/{candidate_id}/artifacts?per_page=100"
                      )
                      artifacts = artifacts_payload.get("artifacts", [])
                      if not isinstance(artifacts, list):
                          continue
                      matches = []
                      for artifact in artifacts:
                          if not isinstance(artifact, dict):
                              continue
                          name = artifact.get("name")
                          expired = artifact.get("expired", False)
                          if isinstance(name, str) and name.startswith("benchforge-v2-results-") and not expired:
                              matches.append(name)
                      if matches:
                          artifact_name = sorted(matches)[-1]
                          run_id = candidate_id
                          break
          except (KeyError, urllib.error.URLError, TimeoutError, json.JSONDecodeError):
              artifact_name = ""
              run_id = ""

          with open(output_path, "a", encoding="utf-8") as handle:
              handle.write(f"artifact_name={artifact_name}\n")
              handle.write(f"run_id={run_id}\n")
          PY

      - name: Download previous benchforge v2 artifact
        if: steps.previous_benchforge.outputs.artifact_name != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p results/baseline_v2
          gh run download "${{ steps.previous_benchforge.outputs.run_id }}" \
            -n "${{ steps.previous_benchforge.outputs.artifact_name }}" \
            -D results/baseline_v2

      - name: Generate benchforge reports
        run: |
          mkdir -p results/reports
          for artifact in results/benchforge_v2/*.json; do
            suite_name="$(basename "${artifact%.json}")"
            output_dir="results/reports/${suite_name}"
            baseline_artifact="results/baseline_v2/${suite_name}.json"
            if [ -f "$baseline_artifact" ]; then
              python3 scripts/generate_report.py \
                --input "$artifact" \
                --baseline "$baseline_artifact" \
                --output-dir "$output_dir"
            else
              python3 scripts/generate_report.py \
                --input "$artifact" \
                --output-dir "$output_dir"
            fi
          done

      - name: Capture candidate provenance
        id: candidate
        run: |
          # Measured on this runner. Never copy comparable_group or identity from a baseline.
          candidate_dir="$RUNNER_TEMP/nightly-python-tier1"
          workload_revision="$(cd python && python3 -c 'import bench_pycubrid as b; print(b.WORKLOAD_REVISION)')"
          python3 scripts/run_provenance.py capture \
            --out-dir "$candidate_dir" \
            --label nightly-python-tier1 \
            --role candidate \
            --results results/python_tier1.json \
            --scenario python-tier1 \
            --workload-revision "$workload_revision" \
            --schema "bench_driver_pycubrid (id INT PRIMARY KEY, name VARCHAR(100), amount INT)" \
            --data-count 10000 \
            --transaction-policy "autocommit=false; one commit per write round" \
            --measurement-protocol "pytest-benchmark pedantic; 1 warm-up + 5 rounds; untimed setup/teardown" \
            --cubrid-image cubrid/cubrid:11.2
          # Keep the whole candidate run (run.yaml + raw/) in the uploaded reports artifact.
          mkdir -p results/reports/regression
          cp -R "$candidate_dir" results/reports/regression/candidate
          printf 'dir=%s\n' "$candidate_dir" >> "$GITHUB_OUTPUT"

      - name: Compare nightly run against a compatible baseline
        id: compare_regression
        env:
          CANDIDATE_DIR: ${{ steps.candidate.outputs.dir }}
        run: |
          # A missing or incompatible baseline yields "not comparable / needs fresh baseline"
          # with open_issue=false; only an input error fails this step.
          python3 scripts/nightly_compare.py \
            --candidate-dir "$CANDIDATE_DIR" \
            --search experiments/tier1-python-workload \
            --output-dir results/reports/regression \
            --github-output "$GITHUB_OUTPUT"
          cat results/reports/regression/regression_comment.md >> "$GITHUB_STEP_SUMMARY"

      - name: Create issue for nightly regression
        if: steps.compare_regression.outputs.open_issue == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          existing=$(gh issue list \
            --search "Nightly benchmark regression detected: Python Tier 1 in:title" \
            --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file results/reports/regression/regression_comment.md
          else
            gh issue create \
              --title "Nightly benchmark regression detected: Python Tier 1" \
              --body-file results/reports/regression/regression_comment.md
          fi

      - name: Save results and clean working tree
        run: |
          cp -r results/ /tmp/bench-results/
          git checkout -- results/

      - name: Upload benchforge v2 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchforge-v2-results-${{ github.run_id }}
          path: /tmp/bench-results/benchforge_v2/*.json
          if-no-files-found: error

      - name: Upload benchforge report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchforge-reports-${{ github.run_id }}
          path: /tmp/bench-results/reports/
          if-no-files-found: error

      - name: Publish benchmark report
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Python Tier1 Benchmark
          tool: pytest
          output-file-path: /tmp/bench-results/python_tier1.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench
          alert-threshold: "110%"
          comment-on-alert: true
          fail-on-alert: false
          summary-always: true

  matrix-benchmark:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.event.schedule == '0 4 * * 0')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        driver-version: ["1.0.0"]
    services:
      cubrid:
        image: cubrid/cubrid:11.2
        env:
          CUBRID_DB: benchdb
        ports:
          - 33000:33000
        options: >-
          --health-cmd "bash -c 'echo > /dev/tcp/127.0.0.1/33000'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: bench
          MYSQL_DATABASE: benchdb
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h127.0.0.1 -uroot -pbench --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r python/requirements.txt
          python -m pip install pycubrid==${{ matrix.driver-version }}

      - name: Wait for databases
        run: ./scripts/wait_for_db.sh

      - name: Apply schema and seed data
        run: make seed

      - name: Run Python Tier 1 benchmark
        run: make tier1-python

      - name: Compute matrix artifact names
        id: matrix_meta
        run: |
          python_slug="${{ matrix.python-version }}"
          driver_slug="${{ matrix.driver-version }}"
          python_slug="${python_slug//./}"
          driver_slug="${driver_slug//./}"
          printf 'result_file=python%s_pycubrid%s.json\n' "$python_slug" "$driver_slug" >> "$GITHUB_OUTPUT"
          printf 'artifact_name=python-tier1-py%s-pycubrid-%s\n' "${{ matrix.python-version }}" "${{ matrix.driver-version }}" >> "$GITHUB_OUTPUT"

      - name: Package matrix result
        run: |
          mkdir -p results
          python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          python_version = "${{ matrix.python-version }}"
          driver_version = "${{ matrix.driver-version }}"
          result_slug = "${{ steps.matrix_meta.outputs.result_file }}"

          source_path = Path("results/python_tier1.json")
          payload = json.loads(source_path.read_text(encoding="utf-8"))
          wrapped = {
              "scenario": "tier1-python",
              "python": python_version,
              "driver": "pycubrid",
              "driver_version": driver_version,
              "source_file": source_path.name,
              "results": payload,
          }

          Path("results", result_slug).write_text(
              json.dumps(wrapped, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload matrix result artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.matrix_meta.outputs.artifact_name }}
          path: results/${{ steps.matrix_meta.outputs.result_file }}

  matrix-manifest:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.event.schedule == '0 4 * * 0')
    needs: matrix-benchmark
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download matrix result artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: python-tier1-*
          merge-multiple: true
          path: results

      - name: Generate matrix manifest
        run: python scripts/generate_manifest.py --results-dir results

      - name: Upload matrix manifest artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-tier1-matrix-manifest
          path: results/manifest.json
