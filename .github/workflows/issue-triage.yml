name: Mark new issues for triage

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  triage-intake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Mark incoming issue for review
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label 'status: needs triage'
