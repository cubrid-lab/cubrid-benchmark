id: pycubrid-release-baseline
title: "pycubrid release baseline (main vs latest release vs CUBRIDdb)"
status: active
question: "On one CUBRID server, is pycubrid main slower than the latest release, and how does pycubrid compare with the official CUBRIDdb driver across connect, single-row DML, executemany, fetch modes and sync/async concurrency?"
system_under_test: "pycubrid main and 1.10.0 (sync + pycubrid.aio) vs CUBRIDdb (cubrid-python v11.3.0.51) on CUBRID 11.4"
workload:
  name: "driver-baseline"
  schema: "bench797_rows / bench797_batch (id INT PK, name VARCHAR(100), email VARCHAR(200), age INT)"
  dataset: "10,000 deterministic rows: (i, 'user_i', 'user_i@example.com', 20 + i % 50)"
protocol:
  warmup: "discarded warm-up iterations per case: 20 connect, 100 select_pk, 30 per single-row DML, 3 per executemany size and fetch mode, 1 round per concurrency level"
  measurement: "time.perf_counter_ns(); per-case iteration counts in scripts/driver_baseline_bench.py; 5 trials per driver in rotating order"
  iterations: 5
  metrics: [median_ms, p95_ms, iqr_ms, stdev_ms, throughput, tracemalloc_peak_bytes, ru_maxrss_kb]
  verification: "every measured iteration checks row counts and values; failures abort the run"
  transaction_mode: "autocommit=False on every connection, explicit commit per write op"
repro:
  setup: "docker run -d --name bench797-114 -e CUBRID_DB=testdb -p 33511:33000 cubrid/cubrid:11.4"
  run: "experiments/pycubrid-release-baseline/run.sh experiments/pycubrid-release-baseline/runs/<run-id> 5"
