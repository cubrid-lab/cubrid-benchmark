id: pycubrid-pinned-lane-demo
title: "Pinned-release candidate-to-baseline comparison (mechanics demonstration)"
status: completed
question: "Does a pinned-release candidate compare against a baseline only when its measured environment and workload identity match, with the driver revision as the only difference?"
system_under_test: "pycubrid 1.11.0 (baseline) vs 1.12.0 (candidate), both from PyPI, with sqlalchemy-cubrid 1.11.0, SQLAlchemy 2.1.4 and pytest-benchmark 5.3.0 pinned"
workload:
  name: "tier1-python"
  revision: "tier1-explicit-keys-v2"
  schema: "bench_driver_pycubrid (id INT PRIMARY KEY, name VARCHAR(100), amount INT)"
  dataset: "10,000 deterministic rows, re-seeded before every round"
protocol:
  warmup: "1 pedantic warm-up round"
  measurement: "pytest-benchmark pedantic, 5 rounds; one trial per run"
  iterations: 5
  verification: "every round verified by python/bench_pycubrid.py; installs verified by scripts/python_lanes.py verify-install"
  metrics: [ops_per_round]
repro:
  setup: "docker run -d --name bench30-cubrid-114 -e CUBRID_DB=benchdb -p 33681:33000 cubrid/cubrid:11.4 (and cubrid/cubrid:10.2 on 33682)"
  run: |
    D=experiments/pycubrid-pinned-lane-demo
    FIXED_HOST=devbox-i5-9400F CUBRID_PORT=33681 $D/run.sh $D/runs/<date>_pycubrid-1.11.0-baseline 1.11.0 baseline
    FIXED_HOST=devbox-i5-9400F CUBRID_PORT=33681 $D/run.sh $D/runs/<date>_pycubrid-1.12.0-candidate 1.12.0 candidate $D/runs/<date>_pycubrid-1.11.0-baseline
    FIXED_HOST=devbox-i5-9400F CUBRID_PORT=33682 CUBRID_VERSION=10.2 $D/run.sh $D/runs/<date>_pycubrid-1.12.0-cubrid102-candidate 1.12.0 candidate $D/runs/<date>_pycubrid-1.11.0-baseline
  notes: "run.sh performs every step of the recorded runs: a fresh venv pinned by python/constraints-current.txt with pycubrid==<version>, scripts/python_lanes.py verify-install --constraints <file> --output versions.json, python/bench_pycubrid.py, scripts/run_provenance.py capture with the pinned-lane arguments plus --cubrid-port and --versions-file, and scripts/compare_runs.py. The recorded runs were measured before run.sh existed and before capture copied raw/versions.json itself. Their compares_to field was set after capture."
